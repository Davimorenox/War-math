<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WAR MATH MOBILE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#0b1020;
    font-family:'Poppins',sans-serif;
}

/* GAME */
#game{
    width:100vw;
    height:100vh;
    position:relative;
    background:radial-gradient(circle at top,#1e3a8a 0%,#0f172a 50%,#020617 100%);
}

/* HUD */
#hud{
    position:absolute;
    top:10px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:0 10px;
}

.panel{
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    padding:10px;
    color:white;
    backdrop-filter:blur(10px);
}

.lifeBar{
    height:14px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.life{
    height:100%;
    width:100%;
    transition:0.3s;
}

#playerLife{ background:linear-gradient(90deg,#22c55e,#4ade80); }
#enemyLife{ background:linear-gradient(90deg,#ef4444,#f87171); }

/* SOLDADOS */
.soldier{
    position:absolute;
    bottom:120px;
    width:90px;
}

#player{ left:10px; }
#enemy{ right:10px; transform:scaleX(-1); }

/* CENTRO */
#centerBox{
    position:absolute;
    top:55%;
    left:50%;
    transform:translate(-50%,-50%);
    width:95%;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:18px;
    color:white;
    text-align:center;
    backdrop-filter:blur(10px);
}

#title{
    font-family:'Orbitron';
    font-size:34px;
    font-weight:900;
}

#question{
    font-size:40px;
    font-weight:800;
    margin:10px 0;
}

#answerDisplay{
    background:white;
    color:black;
    height:60px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    margin-bottom:10px;
}

/* TIMER */
#timerBox{
    height:14px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:10px;
}

#timerBar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#38bdf8,#0ea5e9);
}

/* TECLADO */
#customKeyboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

/* BOTÕES */
#customKeyboard button{
    height:58px;
    font-size:22px;
    font-weight:800;
    border:none;
    border-radius:14px;
    color:white;
    background:linear-gradient(135deg,#334155,#0f172a);
    box-shadow:0 6px 12px rgba(0,0,0,0.35);
    transition:0.15s;
}

/* animação toque */
#customKeyboard button:active{
    transform:scale(0.88);
    filter:brightness(1.3);
}

/* BACKSPACE / OK */
#customKeyboard button:nth-child(10){
    background:linear-gradient(135deg,#ef4444,#991b1b);
}

#customKeyboard button:nth-child(12){
    background:linear-gradient(135deg,#22c55e,#15803d);
}

/* BOTÃO RESPONDER */
#confirmBtn{
    margin-top:10px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    font-size:18px;
    font-weight:800;
    color:white;
    background:linear-gradient(135deg,#22c55e,#15803d);
}

/* MENU */
#menu{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

#menu h1{
    font-family:'Orbitron';
    font-size:45px;
    margin-bottom:20px;
}

/* 🔥 BOTÕES DE DIFICULDADE */
.menu-btn{
    width:80%;
    margin:6px 0;
    padding:14px;
    font-size:18px;
    font-weight:800;
    border:none;
    border-radius:14px;
    color:white;
}

/* CORES DAS DIFICULDADES */
.easy{ background:linear-gradient(135deg,#22c55e,#15803d); }
.medium{ background:linear-gradient(135deg,#f59e0b,#d97706); }
.hard{ background:linear-gradient(135deg,#ef4444,#991b1b); }
.expert{ background:linear-gradient(135deg,#a855f7,#581c87); }

</style>
</head>

<body>

<div id="game">

<div id="hud">
    <div class="panel">🟢 VOCÊ <div class="lifeBar"><div id="playerLife" class="life"></div></div></div>
    <div class="panel">🔴 INIMIGO <div class="lifeBar"><div id="enemyLife" class="life"></div></div></div>
</div>

<img id="player" class="soldier" src="https://cdn-icons-png.flaticon.com/512/892/892781.png">
<img id="enemy" class="soldier" src="https://cdn-icons-png.flaticon.com/512/892/892781.png">

<div id="centerBox">

<div id="title">WAR MATH</div>
<div id="question">2 + 2</div>
<div id="answerDisplay">?</div>

<div id="timerBox"><div id="timerBar"></div></div>

<div id="customKeyboard">
    <button onclick="press(this,'1')">1</button>
    <button onclick="press(this,'2')">2</button>
    <button onclick="press(this,'3')">3</button>

    <button onclick="press(this,'4')">4</button>
    <button onclick="press(this,'5')">5</button>
    <button onclick="press(this,'6')">6</button>

    <button onclick="press(this,'7')">7</button>
    <button onclick="press(this,'8')">8</button>
    <button onclick="press(this,'9')">9</button>

    <button onclick="backspace(this)">⌫</button>
    <button onclick="press(this,'0')">0</button>
    <button onclick="checkAnswer(this)">✓</button>
</div>

<button id="confirmBtn" onclick="checkAnswer()">RESPONDER</button>

</div>

<div id="menu">
    <h1>WAR MATH</h1>

    <button class="menu-btn easy" onclick="startGame('easy')">FÁCIL</button>
    <button class="menu-btn medium" onclick="startGame('medium')">MÉDIO</button>
    <button class="menu-btn hard" onclick="startGame('hard')">DIFÍCIL</button>
    <button class="menu-btn expert" onclick="startGame('expert')">EXPERT 🔥</button>
</div>

</div>

<script>

let currentAnswer="";
let correctAnswer=0;
let timer;
let timeLeft=100;
let enemyLife=100;
let playerLife=100;
let difficulty="easy";

function startGame(d){
    difficulty=d;
    document.getElementById("menu").style.display="none";

    enemyLife=100;
    playerLife=100;
    updateLife();

    generateQuestion();
}

function generateQuestion(){
    clearInterval(timer);
    timeLeft=100;
    document.getElementById("timerBar").style.width="100%";

    let a,b,ops;

    if(difficulty=="easy"){ a=rand(1,10); b=rand(1,10); ops=["+","-"]; }
    if(difficulty=="medium"){ a=rand(1,12); b=rand(1,12); ops=["+","-","×"]; }
    if(difficulty=="hard"){ a=rand(1,20); b=rand(1,20); ops=["+","-","×","÷"]; }
    if(difficulty=="expert"){ a=rand(10,80); b=rand(2,40); ops=["+","-","×","÷"]; }

    let op=ops[Math.floor(Math.random()*ops.length)];

    if(op==="+")correctAnswer=a+b;
    if(op==="-")correctAnswer=a-b;
    if(op==="×")correctAnswer=a*b;
    if(op==="÷"){correctAnswer=Math.floor(a/b);a=correctAnswer*b;}

    document.getElementById("question").innerText=`${a} ${op} ${b}`;
    currentAnswer="";
    document.getElementById("answerDisplay").innerText="?";

    startTimer();
}

function startTimer(){
    timer=setInterval(()=>{
        timeLeft--;
        document.getElementById("timerBar").style.width=timeLeft+"%";

        if(timeLeft<=0){
            clearInterval(timer);
            playerHit();
        }
    },100);
}

function press(btn,num){
    animate(btn);
    currentAnswer+=num;
    document.getElementById("answerDisplay").innerText=currentAnswer;
}

function backspace(btn){
    animate(btn);
    currentAnswer=currentAnswer.slice(0,-1);
    document.getElementById("answerDisplay").innerText=currentAnswer||"?";
}

function checkAnswer(btn){
    if(btn) animate(btn);

    if(Number(currentAnswer)==correctAnswer){
        enemyLife-=20;
    }else{
        playerLife-=20;
    }

    updateLife();
    currentAnswer="";

    if(enemyLife<=0){ alert("VOCÊ VENCEU!"); location.reload(); }
    if(playerLife<=0){ alert("VOCÊ PERDEU!"); location.reload(); }

    generateQuestion();
}

function updateLife(){
    document.getElementById("enemyLife").style.width=enemyLife+"%";
    document.getElementById("playerLife").style.width=playerLife+"%";
}

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

/* 🔥 ANIMAÇÃO BOTÃO */
function animate(btn){
    btn.style.transform="scale(0.88)";
    btn.style.filter="brightness(1.4)";
    setTimeout(()=>{
        btn.style.transform="scale(1)";
        btn.style.filter="brightness(1)";
    },120);
}

</script>

</body>
</html>

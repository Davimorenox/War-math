<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WAR MATH MOBILE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#0b1020;
    font-family:'Poppins',sans-serif;
}

/* GAME */
#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at top,#1e3a8a 0%,#0f172a 50%,#020617 100%);
}

/* HUD */
#hud{
    position:absolute;
    top:5px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:0 10px;
    z-index:10;
}

.panel{
    background:rgba(255,255,255,0.08);
    border-radius:14px;
    padding:8px;
    color:white;
    font-size:12px;
}

.lifeBar{
    height:10px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.life{
    height:100%;
    width:100%;
    transition:0.3s;
}

#playerLife{ background:linear-gradient(90deg,#22c55e,#4ade80); }
#enemyLife{ background:linear-gradient(90deg,#ef4444,#f87171); }

/* SOLDADOS */
.soldier{
    position:absolute;
    bottom:110px;
    width:70px;
}

#player{ left:10px; }
#enemy{ right:10px; transform:scaleX(-1); }

/* CENTRO (MENOR PRA CABER NA TELA) */
#centerBox{
    position:absolute;
    top:52%;
    left:50%;
    transform:translate(-50%,-50%);
    width:92%;
    max-height:60vh;
    background:rgba(255,255,255,0.08);
    border-radius:18px;
    padding:12px;
    color:white;
    text-align:center;
    backdrop-filter:blur(10px);
}

/* TITULO */
#title{
    font-family:'Orbitron';
    font-size:26px;
    font-weight:900;
}

/* QUESTÃO */
#question{
    font-size:34px;
    font-weight:800;
    margin:6px 0;
}

/* RESPOSTA */
#answerDisplay{
    background:white;
    color:black;
    height:50px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
}

/* TIMER */
#timerBox{
    height:10px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin:8px 0;
}

#timerBar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#38bdf8,#0ea5e9);
}

/* TECLADO */
#customKeyboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:6px;
}

/* BOTÕES */
.key{
    height:48px;
    font-size:18px;
    font-weight:800;
    border:none;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#334155,#0f172a);
    transition:0.15s;
}

/* ANIMAÇÃO TOQUE */
.key:active{
    transform:scale(0.88);
    filter:brightness(1.3);
}

/* ESPECIAIS */
.danger{ background:linear-gradient(135deg,#ef4444,#991b1b); }
.ok{ background:linear-gradient(135deg,#22c55e,#15803d); }
.zero{ background:linear-gradient(135deg,#475569,#0f172a); }

/* BOTÃO PRINCIPAL */
#confirmBtn{
    margin-top:8px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:800;
    color:white;
    background:linear-gradient(135deg,#22c55e,#15803d);
}

/* MENU */
#menu{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

#menu h1{
    font-family:'Orbitron';
    font-size:36px;
    margin-bottom:10px;
}

.menu-btn{
    width:80%;
    margin:5px 0;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:800;
    color:white;
}

.easy{ background:linear-gradient(135deg,#22c55e,#15803d); }
.medium{ background:linear-gradient(135deg,#f59e0b,#d97706); }
.hard{ background:linear-gradient(135deg,#ef4444,#991b1b); }
.expert{ background:linear-gradient(135deg,#a855f7,#581c87); }

</style>
</head>

<body>

<div id="game">

<div id="hud">
    <div class="panel">🟢 VOCÊ
        <div class="lifeBar"><div id="playerLife" class="life"></div></div>
    </div>

    <div class="panel">🔴 INIMIGO
        <div class="lifeBar"><div id="enemyLife" class="life"></div></div>
    </div>
</div>

<img id="player" class="soldier" src="https://cdn-icons-png.flaticon.com/512/892/892781.png">
<img id="enemy" class="soldier" src="https://cdn-icons-png.flaticon.com/512/892/892781.png">

<div id="centerBox">

<div id="title">WAR MATH</div>

<div id="question">2 + 2</div>

<div id="answerDisplay">?</div>

<div id="timerBox"><div id="timerBar"></div></div>

<!-- TECLADO -->
<div id="customKeyboard">

<button class="key" onclick="press('1')">1</button>
<button class="key" onclick="press('2')">2</button>
<button class="key" onclick="press('3')">3</button>

<button class="key" onclick="press('4')">4</button>
<button class="key" onclick="press('5')">5</button>
<button class="key" onclick="press('6')">6</button>

<button class="key" onclick="press('7')">7</button>
<button class="key" onclick="press('8')">8</button>
<button class="key" onclick="press('9')">9</button>

<!-- BOTÃO MENOS (BACKSPACE) -->
<button class="key danger" onclick="backspace()">-</button>

<button class="key zero" onclick="press('0')">0</button>

<!-- CONFIRMAR -->
<button class="key ok" onclick="checkAnswer()">✓</button>

</div>

<button id="confirmBtn" onclick="checkAnswer()">RESPONDER</button>

</div>

<div id="menu">

<h1>WAR MATH</h1>

<button class="menu-btn easy" onclick="startGame('easy')">FÁCIL</button>
<button class="menu-btn medium" onclick="startGame('medium')">MÉDIO</button>
<button class="menu-btn hard" onclick="startGame('hard')">DIFÍCIL</button>
<button class="menu-btn expert" onclick="startGame('expert')">EXPERT 🔥</button>

</div>

</div>

<script>

let current="";
let answer=0;
let timer;
let time=100;
let enemy=100;
let player=100;
let diff="easy";

function startGame(d){
    diff=d;
    document.getElementById("menu").style.display="none";
    enemy=100; player=100;
    update();
    gen();
}

function gen(){
    clearInterval(timer);
    time=100;
    document.getElementById("timerBar").style.width="100%";

    let a,b,ops;

    if(diff=="easy"){a=r(1,10);b=r(1,10);ops=["+","-"];}
    if(diff=="medium"){a=r(1,12);b=r(1,12);ops=["+","-","×"];}
    if(diff=="hard"){a=r(1,20);b=r(1,20);ops=["+","-","×","÷"];}
    if(diff=="expert"){a=r(10,80);b=r(2,40);ops=["+","-","×","÷"];}

    let op=ops[Math.floor(Math.random()*ops.length)];

    if(op=="+")answer=a+b;
    if(op=="-")answer=a-b;
    if(op=="×")answer=a*b;
    if(op=="÷"){answer=Math.floor(a/b);a=answer*b;}

    document.getElementById("question").innerText=`${a} ${op} ${b}`;
    current="";
    document.getElementById("answerDisplay").innerText="?";

    startTimer();
}

function startTimer(){
    timer=setInterval(()=>{
        time--;
        document.getElementById("timerBar").style.width=time+"%";
        if(time<=0){clearInterval(timer);hitPlayer();}
    },100);
}

function press(n){
    current+=n;
    document.getElementById("answerDisplay").innerText=current;
}

function backspace(){
    current=current.slice(0,-1);
    document.getElementById("answerDisplay").innerText=current||"?";
}

function checkAnswer(){
    if(Number(current)==answer)hitEnemy();
    else hitPlayer();
    current="";
}

function hitEnemy(){
    enemy-=20;
    update();
    if(enemy<=0)return win();
    gen();
}

function hitPlayer(){
    player-=20;
    update();
    if(player<=0)return lose();
    gen();
}

function update(){
    document.getElementById("enemyLife").style.width=enemy+"%";
    document.getElementById("playerLife").style.width=player+"%";
}

function win(){alert("VOCÊ VENCEU!");location.reload();}
function lose(){alert("VOCÊ PERDEU!");location.reload();}
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

</script>

</body>
</html>
